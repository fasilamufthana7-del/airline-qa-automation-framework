name: Run Test Suite

# Runs automatically on every push to main, and on every pull request
# targeting main — this is what gives you the green/red checkmark badge.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Lets you also trigger a run manually from the Actions tab on GitHub,
  # without needing to push a change first.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run tests (UI + API)
        run: mvn test
        # BaseTest.java detects the CI=true variable GitHub Actions sets
        # automatically and switches Chrome to headless mode on its own —
        # no extra configuration needed here.

      - name: Upload Extent report (even if tests failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report
          path: target/extent-reports/
          if-no-files-found: ignore
